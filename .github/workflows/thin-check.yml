name: Thin check (temporary)
on:
  push:
    branches: [claude/project-thread-z9mftg]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          sleep 3
                    node tools/thin-check.mjs "Perth" "Perth, Scotland" "Perth, Western Australia" "-31.95590,115.86058" "-31.9505,115.8605" "Sydney" "Melbourne" "Brisbane" "Adelaide" "Auckland" "Canberra" "Dallas" "Houston" "Denver" "Calgary" "Phoenix" "Atlanta" "Dubai" "Singapore" "Hong Kong" "Glasgow" "Edinburgh" "Manchester" "Berlin" "Hamburg" "London" "Paris" "New York" "Tokyo" "Rio"
