name: Deploy to GitHub Pages

# Builds and publishes the game. Run it by hand from the Actions tab: the game is not public
# yet, so nothing is published on a push.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To publish on every push to main later, add `push: { branches: [main] }` under `on`.
#
# The published site is kept on the `site` branch: this game at the root, and the preview of each
# open pull request under preview/pr-<n>/ (see preview.yml and publish-preview.yml). A deploy
# replaces the game at the root and leaves the previews as they are.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Put the game on the site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/site/update.sh live dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # shared with the preview deploys: one at a time, each publishing the site branch as it is when it starts
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the site branch
        uses: actions/checkout@v6
        with:
          ref: site
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
