name: Deploy to GitHub Pages

# Publishes the built game in game/ as it is. Nothing is built here: the source is private.
# Run it by hand from the Actions tab after new game files land on main.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
