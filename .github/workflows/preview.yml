name: Preview build

# Builds the game from a pull request as a preview, to be played at
# https://yourplace3d.github.io/3dcity-games/preview/pr-<n>/ before it reaches players.
# This only builds; publish-preview.yml puts it up and posts the link on the pull request.
# When the pull request is closed or merged, its preview is taken down.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        env:
          VITE_PREVIEW: pr-${{ github.event.pull_request.number }}
        run: npm run build

      - name: Say what to publish
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p out
          if [ "$ACTION" = closed ]; then echo remove > out/action; else echo preview > out/action; cp -R dist out/dist; fi
          echo "$NUMBER" > out/number
          echo "$SHA" > out/sha

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out
          retention-days: 3
