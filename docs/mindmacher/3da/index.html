<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3DA: a driving game on the real map of your city</title>
    <meta name="description" content="3DA is a small driving game on the real 3D map of any city. Free, in the browser." />
    <meta name="robots" content="noindex" />
    <!-- This page only forwards to the game. It stores nothing and contacts nobody. -->
    <meta http-equiv="refresh" content="0; url=https://yourplace3d.github.io/3dcity-games/?ref=youtube" />
    <script>
      // whatever follows the short address goes along: a place (#52.52,13.405 or #Hamburg) and a
      // challenge (?c=...)
      var q = new URLSearchParams(location.search);
      q.set('ref', 'youtube');
      location.replace('https://yourplace3d.github.io/3dcity-games/?' + q.toString() + location.hash);
    </script>
    <style>
      body { margin: 0; background: #16181c; color: #f4f1ea; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 520px; margin: 0 auto; padding: 48px 18px; }
      a { color: #ffd400; }
    </style>
  </head>
  <body>
    <main>
      <p>Taking you to the game. <a href="https://yourplace3d.github.io/3dcity-games/?ref=youtube">Open 3DA</a></p>
    </main>
  </body>
</html>
