<!doctype html><html><body style="margin:0"><canvas id="c" width="1000" height="700"></canvas>
<!-- The ground's relief (bare slopes, cliffs, snow) on the real heights of a place, seen from above as in the
     game, without the map (roads, buildings, land) so it works where the map tiles can't be reached.
     npx vite, then open /tools/relief-bench.html#lat,lon,height[,off]  ("off" leaves the relief out). -->
<script type="module">
import * as THREE from 'three';
import '../src/game/world.ts'; // the game's colours
import { PALETTE } from '../src/scene/overlay.ts';
import { loadHeightGrid } from '../src/geo/terrain.ts';
import { CityModel } from '../src/scene/cityModel.ts';
import { reliefImage } from '../src/scene/relief.ts';
import { showRelief } from '../src/game/roadMesh.ts';
const [lat, lon, h, off] = location.hash.slice(1).split(',');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(1000, 700, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfd8dc');
const grid = await loadHeightGrid({ lat: +lat, lon: +lon }, 1500, 193);
const model = new CityModel(grid, 4096, '#ffcc00');
const relief = off ? null : reliefImage(grid, +lat, PALETTE);
model.overlay.relief = relief;
model.setExaggeration(1); model.showPin(false);
model.terrain.walls.visible = false; model.terrain.base.visible = false;
model.setFeatures({ areas: [], lines: [], coastlines: [], sea: [] });
showRelief(model.terrain.surface.geometry);
scene.add(model.group);
const sun = new THREE.DirectionalLight('#fff4e0', 2.5);
scene.add(new THREE.HemisphereLight('#ffffff', '#c9c0b0', 1.3), sun, sun.target);
const camera = new THREE.PerspectiveCamera(42, 1000 / 700, 2, 8000);
const mid = model.groundY(0, 0);
camera.position.set(0, mid + +h, 0.01); camera.lookAt(0, mid, 0);
sun.position.set(-0.55 * 500, mid + 0.78 * 500, -0.55 * 500); sun.target.position.set(0, mid, 0);
renderer.render(scene, camera);
window.result = { stats: relief?.stats ?? null, min: grid.min, max: grid.max };
</script></body></html>
