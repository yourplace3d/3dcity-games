name: Deploy to GitHub Pages

# Builds and publishes the game. Run it by hand from the Actions tab: the game is not public
# yet, so nothing is published on a push.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To publish on every push to main later, add `push: { branches: [main] }` under `on`.
#
# The published site is kept on the `site` branch: this game at the root, and the preview of each
# open pull request under preview/pr-<n>/ (see preview.yml and publish-preview.yml). A deploy
# replaces the game at the root and leaves the previews as they are.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Put the game on the site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/site/update.sh live dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # shared with the preview deploys: one at a time, each publishing the site branch as it is when it starts
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      # to see the uploaded artifact listed (the wait below)
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the site branch
        uses: actions/checkout@v6
        with:
          ref: site
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # The artifact just uploaded can take a moment to be listed, and the deploy step looks only once: on
      # 28 November it found none in the same second (runs 89 and 91; a fresh run went through each time).
      # So wait until it is listed, a minute at most. A re-run of a failed deploy finds two and fails again:
      # start a fresh run instead.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "listed after about $((i * 2)) s"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "not listed after 60 s: deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
